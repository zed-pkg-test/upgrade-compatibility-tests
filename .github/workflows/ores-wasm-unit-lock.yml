name: ORES generated WASM unit lock proof

on:
  pull_request:
    paths:
      - '.github/workflows/ores-wasm-unit-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-lock-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88'
          components: rustfmt, clippy

      - name: Materialize independent lock-boundary proof crate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ores-lock-proof/src"
          cat >"$RUNNER_TEMP/ores-lock-proof/Cargo.toml" <<'EOF'
          [package]
          name = "ores-generated-unit-lock-proof"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.88"
          publish = false

          [dev-dependencies]
          tempfile = "3"

          [lints.rust]
          unsafe_code = "forbid"

          [lints.clippy]
          all = "deny"
          pedantic = "allow"
          EOF
          cat >"$RUNNER_TEMP/ores-lock-proof/src/lib.rs" <<'EOF'
          #![forbid(unsafe_code)]

          use std::{
              fs,
              path::{Component, Path, PathBuf},
              process::{Command, Stdio},
          };

          const MAX_GENERATED_LOCK_BYTES: u64 = 4 * 1024 * 1024;

          fn truncate_utf8(bytes: &[u8], max_bytes: usize) -> String {
              let text = String::from_utf8_lossy(bytes);
              if text.len() <= max_bytes {
                  return text.into_owned();
              }
              let mut start = text.len().saturating_sub(max_bytes);
              while !text.is_char_boundary(start) {
                  start += 1;
              }
              return text[start..].to_owned();
          }

          fn refuse_symlink_components(root: &Path, target: &Path) -> Result<(), String> {
              let relative = target
                  .strip_prefix(root)
                  .map_err(|_| "generated path escapes project root".to_owned())?;
              let mut current = root.to_path_buf();
              for component in relative.components() {
                  let Component::Normal(segment) = component else {
                      return Err("generated path is not normalized".to_owned());
                  };
                  current.push(segment);
                  match fs::symlink_metadata(&current) {
                      Ok(metadata) if metadata.file_type().is_symlink() => {
                          return Err(format!(
                              "generated path traverses symlink {}",
                              current.display()
                          ));
                      }
                      Ok(_) => {}
                      Err(error) if error.kind() == std::io::ErrorKind::NotFound => break,
                      Err(error) => {
                          return Err(format!("could not inspect {}: {error}", current.display()));
                      }
                  }
              }
              return Ok(());
          }

          fn ensure_unit_lock(root: &Path, manifest_path: &Path) -> Result<PathBuf, String> {
              let unit_dir = manifest_path
                  .parent()
                  .ok_or("generated WASM unit manifest has no parent directory")?;
              let lock_path = unit_dir.join("Cargo.lock");
              refuse_symlink_components(root, &lock_path)?;

              match fs::symlink_metadata(&lock_path) {
                  Ok(metadata) => {
                      if metadata.file_type().is_symlink() || !metadata.is_file() {
                          return Err(format!(
                              "generated WASM unit lock {} must be a regular file",
                              lock_path.display()
                          ));
                      }
                  }
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound => {
                      let output = Command::new("cargo")
                          .arg("generate-lockfile")
                          .arg("--manifest-path")
                          .arg(manifest_path)
                          .current_dir(root)
                          .stdin(Stdio::null())
                          .stdout(Stdio::piped())
                          .stderr(Stdio::piped())
                          .output()
                          .map_err(|error| {
                              format!("could not launch generated WASM unit lock resolution: {error}")
                          })?;
                      if !output.status.success() {
                          return Err(format!(
                              "generated WASM unit lock resolution failed with {}; stderr: {}",
                              output.status,
                              truncate_utf8(&output.stderr, 8192)
                          ));
                      }
                  }
                  Err(error) => {
                      return Err(format!(
                          "could not inspect generated WASM unit lock {}: {error}",
                          lock_path.display()
                      ));
                  }
              }

              refuse_symlink_components(root, &lock_path)?;
              let metadata = fs::symlink_metadata(&lock_path).map_err(|error| {
                  format!(
                      "could not inspect generated WASM unit lock {}: {error}",
                      lock_path.display()
                  )
              })?;
              if metadata.file_type().is_symlink() || !metadata.is_file() {
                  return Err(format!(
                      "generated WASM unit lock {} must be a regular file",
                      lock_path.display()
                  ));
              }
              if metadata.len() == 0 || metadata.len() > MAX_GENERATED_LOCK_BYTES {
                  return Err(format!(
                      "generated WASM unit lock {} has invalid size {} bytes",
                      lock_path.display(),
                      metadata.len()
                  ));
              }

              let output = Command::new("cargo")
                  .arg("metadata")
                  .arg("--locked")
                  .arg("--format-version=1")
                  .arg("--manifest-path")
                  .arg(manifest_path)
                  .current_dir(root)
                  .stdin(Stdio::null())
                  .stdout(Stdio::null())
                  .stderr(Stdio::piped())
                  .output()
                  .map_err(|error| {
                      format!("could not validate generated WASM unit lock: {error}")
                  })?;
              if !output.status.success() {
                  return Err(format!(
                      "generated WASM unit lock is stale or incomplete; stderr: {}",
                      truncate_utf8(&output.stderr, 8192)
                  ));
              }
              return Ok(lock_path);
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn write(path: &Path, bytes: &[u8]) -> Result<(), String> {
                  fs::write(path, bytes).map_err(|error| error.to_string())?;
                  return Ok(());
              }

              #[test]
              fn lock_is_created_once_reused_and_stale_graph_fails_closed() -> Result<(), String> {
                  let directory = tempfile::tempdir().map_err(|error| error.to_string())?;
                  let root = directory.path().canonicalize().map_err(|error| error.to_string())?;
                  let unit = root.join("unit");
                  fs::create_dir(&unit).map_err(|error| error.to_string())?;
                  let manifest = unit.join("Cargo.toml");
                  write(
                      &manifest,
                      b"[package]\nname = \"ores-lock-test\"\nversion = \"0.0.0\"\nedition = \"2021\"\n\n[workspace]\n",
                  )?;

                  let lock = ensure_unit_lock(&root, &manifest)?;
                  let first = fs::read(&lock).map_err(|error| error.to_string())?;
                  assert!(!first.is_empty());
                  assert_eq!(ensure_unit_lock(&root, &manifest)?, lock);
                  assert_eq!(fs::read(&lock).map_err(|error| error.to_string())?, first);

                  let dependency = root.join("dep");
                  fs::create_dir(&dependency).map_err(|error| error.to_string())?;
                  fs::create_dir(dependency.join("src")).map_err(|error| error.to_string())?;
                  write(
                      &dependency.join("Cargo.toml"),
                      b"[package]\nname = \"local-dep\"\nversion = \"0.0.0\"\nedition = \"2021\"\n",
                  )?;
                  write(&dependency.join("src/lib.rs"), b"pub fn value() -> u8 { 1 }\n")?;
                  write(
                      &manifest,
                      b"[package]\nname = \"ores-lock-test\"\nversion = \"0.0.0\"\nedition = \"2021\"\n\n[workspace]\n\n[dependencies]\nlocal-dep = { path = \"../dep\" }\n",
                  )?;
                  assert!(ensure_unit_lock(&root, &manifest).is_err());
                  assert_eq!(fs::read(&lock).map_err(|error| error.to_string())?, first);
                  return Ok(());
              }

              #[cfg(unix)]
              #[test]
              fn symlink_lock_is_rejected_without_mutating_target() -> Result<(), String> {
                  use std::os::unix::fs::symlink;

                  let directory = tempfile::tempdir().map_err(|error| error.to_string())?;
                  let root = directory.path().canonicalize().map_err(|error| error.to_string())?;
                  let unit = root.join("unit");
                  fs::create_dir(&unit).map_err(|error| error.to_string())?;
                  let manifest = unit.join("Cargo.toml");
                  write(
                      &manifest,
                      b"[package]\nname = \"ores-lock-test\"\nversion = \"0.0.0\"\nedition = \"2021\"\n\n[workspace]\n",
                  )?;
                  let target = root.join("outside.lock");
                  write(&target, b"do-not-touch\n")?;
                  symlink(&target, unit.join("Cargo.lock")).map_err(|error| error.to_string())?;

                  assert!(ensure_unit_lock(&root, &manifest).is_err());
                  assert_eq!(
                      fs::read(&target).map_err(|error| error.to_string())?,
                      b"do-not-touch\n"
                  );
                  return Ok(());
              }
          }
          EOF

      - name: Format and lint exact lock algorithm
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$RUNNER_TEMP/ores-lock-proof/Cargo.toml" -- --check
          cargo clippy --manifest-path "$RUNNER_TEMP/ores-lock-proof/Cargo.toml" --all-targets -- -D warnings -A clippy::needless-return

      - name: Execute stale-graph and symlink proofs
        run: |
          set -euo pipefail
          cargo test --manifest-path "$RUNNER_TEMP/ores-lock-proof/Cargo.toml" -- --nocapture

      - name: Prove Cargo itself refuses a stale generated lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manual-unit/src" "$RUNNER_TEMP/manual-dep/src"
          cat >"$RUNNER_TEMP/manual-unit/Cargo.toml" <<'EOF'
          [package]
          name = "manual-unit"
          version = "0.0.0"
          edition = "2021"
          [workspace]
          EOF
          echo 'fn main() {}' >"$RUNNER_TEMP/manual-unit/src/main.rs"
          cargo generate-lockfile --manifest-path "$RUNNER_TEMP/manual-unit/Cargo.toml"
          cp "$RUNNER_TEMP/manual-unit/Cargo.lock" "$RUNNER_TEMP/original.lock"

          cat >"$RUNNER_TEMP/manual-dep/Cargo.toml" <<'EOF'
          [package]
          name = "manual-dep"
          version = "0.0.0"
          edition = "2021"
          EOF
          echo 'pub fn value() -> u8 { 1 }' >"$RUNNER_TEMP/manual-dep/src/lib.rs"
          cat >>"$RUNNER_TEMP/manual-unit/Cargo.toml" <<'EOF'
          [dependencies]
          manual-dep = { path = "../manual-dep" }
          EOF

          if cargo build --locked --manifest-path "$RUNNER_TEMP/manual-unit/Cargo.toml"; then
            echo 'cargo build --locked unexpectedly re-resolved a stale generated-unit lock' >&2
            exit 1
          fi
          cmp "$RUNNER_TEMP/manual-unit/Cargo.lock" "$RUNNER_TEMP/original.lock"
